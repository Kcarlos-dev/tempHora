version: '3.9'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: temphora-app
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist               # evita sobrescrever o build
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: npm run start:dev   # ou o comando que você usa em dev