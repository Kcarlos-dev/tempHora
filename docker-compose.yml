services:
  app:
    image: node:24-alpine
    container_name: temphora-app
    working_dir: /app
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    restart: unless-stopped
    command: sh -c "npm install && npm run ${NODE_ENV_SCRIPT}"